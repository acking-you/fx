<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑单车</title>
<style>
  :root { color-scheme: dark; font-family: Georgia, 'Noto Serif SC', serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0d1d2c; overflow: hidden; }
  body { display: grid; place-items: center; }
  .stage { position: relative; width: 100vw; height: 100vh; min-height: 520px; overflow: hidden; background: #102536; }
  canvas { width: 100%; height: 100%; display: block; }
  .title { position: absolute; z-index: 2; left: clamp(24px, 7vw, 96px); top: clamp(28px, 7vh, 78px); pointer-events: none; }
  .eyebrow { margin: 0 0 12px; color: #f4b56c; font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .24em; text-transform: uppercase; }
  h1 { margin: 0; max-width: 540px; color: #fff4dc; font-size: clamp(42px, 7vw, 94px); line-height: .94; letter-spacing: -.045em; font-weight: 400; }
  .sub { margin: 19px 0 0; max-width: 320px; color: #c1d0d4; font-size: clamp(14px, 1.7vw, 18px); line-height: 1.55; }
  .tip { position: absolute; left: clamp(24px, 7vw, 96px); bottom: 28px; color: #27495a; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(255,220,164,.45); }
  .tip b { color: #a9513c; font-weight: 600; }
  .badge { position: absolute; right: clamp(24px, 5vw, 72px); top: 32px; color: #dce9e4; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; letter-spacing: .12em; text-transform: uppercase; }
  .badge span { display: block; color: #f4b56c; margin-top: 6px; letter-spacing: .02em; text-transform: none; }
  @media (max-width: 640px) {
    .stage { min-height: 480px; }
    .title { top: 30px; }
    .sub { max-width: 250px; }
    .tip { bottom: 18px; font-size: 10px; }
    .badge { top: 22px; right: 20px; font-size: 9px; }
  }
</style>
</head>
<body>
<main class="stage" aria-label="一只鹈鹕骑着单车穿过海边黄昏的二维动画">
  <canvas id="scene"></canvas>
  <div class="title">
    <p class="eyebrow">A little ride by the sea</p>
    <h1>鹈鹕<br>骑单车</h1>
    <p class="sub">风从海面吹来，车轮把黄昏慢慢带回家。</p>
  </div>
  <div class="badge">LIVE SKETCH<span>pelican / bicycle / dusk</span></div>
  <div class="tip"><b>SPACE</b> 暂停　·　<b>↑ ↓</b> 调整风速　·　<b>R</b> 重置</div>
</main>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let w = 0, h = 0, dpr = 1, t = 0, paused = false, wind = 1;
const clouds = Array.from({length: 7}, (_, i) => ({x: i * 240 + 40, y: 90 + (i % 3) * 50, s: .65 + (i % 4) * .12}));
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; canvas.width = w*dpr; canvas.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();
function lerp(a,b,n){ return a+(b-a)*n; }
function ellipse(x,y,rx,ry,fill,rot=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); ctx.restore(); }
function line(points, color, width=1){ ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); }
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#122b40'); g.addColorStop(.48,'#2f5360'); g.addColorStop(.78,'#d07b62'); g.addColorStop(1,'#f0ad72'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  const sunX=w*.73, sunY=h*.48; const glow=ctx.createRadialGradient(sunX,sunY,4,sunX,sunY,180); glow.addColorStop(0,'rgba(255,232,171,.95)'); glow.addColorStop(.25,'rgba(255,192,116,.42)'); glow.addColorStop(1,'rgba(255,160,100,0)'); ctx.fillStyle=glow; ctx.fillRect(0,0,w,h);
  ellipse(sunX,sunY,37,37,'#ffe3a2');
  clouds.forEach((c,i)=>{ const x=((c.x - t*(4+i%3)*wind)%(w+300)+w+300)%(w+300)-150; ellipse(x,c.y,70*c.s,13*c.s,'rgba(218,223,210,.09)'); ellipse(x+48*c.s,c.y-7,55*c.s,11*c.s,'rgba(218,223,210,.09)'); });
}
function drawSea(){
  const seaY=h*.69; const g=ctx.createLinearGradient(0,seaY,0,h); g.addColorStop(0,'#255365'); g.addColorStop(1,'#0c2c3d'); ctx.fillStyle=g; ctx.fillRect(0,seaY,w,h-seaY);
  for(let j=0;j<10;j++){ const y=seaY+20+j*18; ctx.globalAlpha=.15-j*.009; for(let i=-1;i<12;i++){ const x=i*150+((t*(7+j)*wind)%(150)); line([[x,y],[x+70,y+Math.sin(i+j)*2],[x+130,y]], '#b0d2c5', 1.2); } } ctx.globalAlpha=1;
  const shoreY=h*.84; ctx.fillStyle='#f0bf82'; ctx.beginPath(); ctx.moveTo(0,shoreY+5); for(let x=0;x<=w;x+=24) ctx.lineTo(x,shoreY+Math.sin(x*.012+t*.006)*7); ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(121,72,60,.22)';ctx.beginPath();ctx.moveTo(0,shoreY+18);for(let x=0;x<=w;x+=18)ctx.lineTo(x,shoreY+18+Math.sin(x*.018+t*.01)*4);ctx.lineTo(w,shoreY+35);ctx.lineTo(0,shoreY+35);ctx.fill();
}
function drawHills(){
  const y=h*.71; ctx.fillStyle='#173746'; ctx.beginPath();ctx.moveTo(0,y); for(let x=0;x<=w;x+=90)ctx.lineTo(x,y-35-Math.sin(x*.009)*26);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  ctx.fillStyle='#0f2b3b';ctx.beginPath();ctx.moveTo(0,h*.78);for(let x=0;x<=w;x+=70)ctx.lineTo(x,h*.78-42-Math.sin(x*.014+2)*18);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
}
function drawBike(cx,cy,scale){
  const bob=Math.sin(t*.12)*3*scale, rot=Math.sin(t*.045)*.025; cy+=bob; ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(scale,scale);
  const r=53, wheelY=67; ctx.lineWidth=3; ctx.strokeStyle='#17384a'; ctx.beginPath();ctx.arc(-70,wheelY,r,0,Math.PI*2);ctx.arc(70,wheelY,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#d77e58';ctx.lineWidth=4; line([[-70,wheelY],[0,-4],[70,wheelY],[-70,wheelY],[0,wheelY],[-3,-4]],'#d77e58',4); line([[70,wheelY],[86,20],[104,20]],'#d77e58',4); line([[-4,-4],[-18,-31]],'#d77e58',4); line([[-25,-32],[-4,-32]],'#d77e58',4);
  const pedal=Math.sin(t*.18)*.35; line([[0,wheelY],[30*Math.cos(pedal),wheelY+30*Math.sin(pedal)]], '#17384a',3); line([[0,wheelY],[-30*Math.cos(pedal),wheelY-30*Math.sin(pedal)]], '#17384a',3);
  ellipse(-36,-74,24,43,'#f6eee0',-.18); ellipse(-2,-110,33,39,'#f6eee0',-.1); ellipse(18,-100,18,8,'#df855e',-.1); ellipse(43,-98,31,6,'#eb9865',-.04);
  ctx.fillStyle='#f6eee0';ctx.beginPath();ctx.moveTo(-16,-138);ctx.quadraticCurveTo(-30,-180,-4,-196);ctx.quadraticCurveTo(28,-211,46,-180);ctx.quadraticCurveTo(53,-145,34,-121);ctx.quadraticCurveTo(9,-111,-16,-138);ctx.fill();
  ellipse(15,-174,4.5,4.5,'#17384a'); ellipse(-2,-179,12,5,'#df855e',-.15);
  ctx.fillStyle='#df855e';ctx.beginPath();ctx.moveTo(34,-151);ctx.quadraticCurveTo(65,-153,89,-139);ctx.quadraticCurveTo(62,-125,29,-131);ctx.closePath();ctx.fill();
  line([[-21,-44],[-50,5],[-30,37]],'#f6eee0',10); line([[-30,37],[-48,48]],'#df855e',7); line([[0,-40],[30,7],[42,33]],'#f6eee0',10); line([[42,33],[61,39]],'#df855e',7);
  const wing=Math.sin(t*.11)*.1; ellipse(-16,-84,14,42,'#d8ded9',wing); line([[-25,-103],[-8,-67]],'#a9bdbb',2);
  ctx.restore();
}
function drawBirds(){ for(let i=0;i<4;i++){ const x=((w*(.15+i*.24)-t*(.7+i*.2))%(w+80)+w+80)%(w+80)-40; const y=h*(.26+i*.055); line([[x,y],[x+10,y-6],[x+20,y]],'rgba(19,45,57,.55)',1.5); } }
function frame(){ if(!paused)t+=wind; drawSky(); drawHills(); drawSea(); drawBirds(); const s=Math.min(w/900, h/700); drawBike(w*.57,h*.69,s*1.05); requestAnimationFrame(frame); }
addEventListener('keydown',e=>{ if(e.code==='Space'){paused=!paused;e.preventDefault();} if(e.key==='ArrowUp')wind=Math.min(2.4,wind+.2); if(e.key==='ArrowDown')wind=Math.max(.2,wind-.2); if(e.key.toLowerCase()==='r'){t=0;wind=1;paused=false;} });
frame();
</script>
</body>
</html>
