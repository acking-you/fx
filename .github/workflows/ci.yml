name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig_mode:
    name: Build & Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimize: ReleaseSafe
            test_timeout_seconds: 900
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-unit-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Validate PGSO corpus classification
        run: python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        env:
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
        run: |
          started_at=$SECONDS
          trap 'printf "Unit tests elapsed: %ss\n" "$((SECONDS - started_at))"' EXIT
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=${{ matrix.optimize }}

  zig:
    name: Build & Test
    if: ${{ always() }}
    needs: zig_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.zig_mode.result }}
        run: test "$MATRIX_RESULT" = success

  sdk-node-wasm:
    name: SDK (Node + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build WASM surfaces (ReleaseSmall)
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall

      - name: Install terminal test dependencies
        run: npm ci --prefix sdk/node

      - name: Test Node + WASM
        run: npm run --prefix sdk test:node-wasm

  sdk-node-napi:
    name: SDK (Node + N-API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build N-API addon (ReleaseSafe)
        run: zig build -Dnapi-surface=core -Doptimize=ReleaseSafe

      - name: Test Node + N-API
        run: npm run --prefix sdk test:node-napi

  sdk-browser-wasm:
    name: SDK (Browser + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build WASM surfaces (ReleaseSmall)
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall

      - name: Test Browser + WASM
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run --prefix sdk test:browser-wasm

  e2e_mode:
    name: E2E (deterministic, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-e2e-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install e2e deps
        run: bun install
        working-directory: tests/e2e

      - name: Install isolated MCP conformance package
        run: npm ci
        working-directory: tests/e2e/conformance

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi

      - name: Run CLI tests
        run: bun test cli.test.ts
        working-directory: tests/e2e

      - name: Run ACP tests (no-key subset)
        run: bun test acp.test.ts
        working-directory: tests/e2e

      - name: Run legacy stdio MCP tool lifecycle test
        run: bun test gateway-stream-lifecycle.test.ts --test-name-pattern "selected dynamic MCP review cautions with zero sends and clears exactly once"
        working-directory: tests/e2e

      - name: Run stdio MCP dispatcher lifecycle tests
        run: bun test mcp-stdio.test.ts
        working-directory: tests/e2e

      - name: Run modern MCP Streamable HTTP tests
        run: bun test mcp-http.test.ts
        working-directory: tests/e2e

      - name: Run legacy MCP remote compatibility tests
        run: bun test mcp-legacy-remote.test.ts
        working-directory: tests/e2e

      - name: Run isolated MCP conformance baseline
        run: npm test
        working-directory: tests/e2e/conformance
        env:
          FX_SOUND: "0"

      - name: Run persistence tests
        run: bun test config-persistence.test.ts session-recovery.test.ts prompt-history.test.ts
        working-directory: tests/e2e

      - name: Run gateway lifecycle recovery regressions
        run: bun test ./gateway-stream-lifecycle.test.ts --test-name-pattern "saved malformed recovery resumes without re-executing the historical call|OS filesystem access denial reaches the next gateway request"
        working-directory: tests/e2e

      - name: Run lean Auto Mode reliability contract
        run: bun test auto-mode-reliability.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run TUI input line deletion regression
        run: |
          tmux -V
          bun test tui-input-line-delete.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run multiline input navigation TUI tests
        run: |
          tmux -V
          bun test tui-input-navigation.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run valid question recovery TUI regression
        run: |
          tmux -V
          bun test ./tui-decision-prompts.test.ts --test-name-pattern "valid serialized ask control with matching identity opens the question and continues"
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run streamed lifecycle, direct-write, and command scrollback regressions
        run: |
          tmux -V
          bun test tui-gateway-stream-lifecycle.test.ts tui-direct-write-audit.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

  e2e:
    name: E2E (deterministic)
    if: ${{ always() }}
    needs: e2e_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.e2e_mode.result }}
        run: test "$MATRIX_RESULT" = success

  cross-target:
    name: Cross-target Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
          - name: windows-x86_64
            target: x86_64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-cross-target-${{ matrix.name }}

      - name: Build target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Report binary size
        run: |
          binary=zig-out/bin/fx
          if [ ! -f "$binary" ]; then binary=zig-out/bin/fx.exe; fi
          bytes=$(stat -c%s "$binary")
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)"
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)" >> "$GITHUB_STEP_SUMMARY"

  windows-native:
    name: Windows native
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-windows-native

      - name: Check formatting
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Run Windows runtime tests
        shell: pwsh
        run: |
          zig build test -Doptimize=ReleaseSafe -- `
            --test-filter "resolver builds Windows command invocations" `
            --test-filter "Windows shell discovery prefers Git Bash installations and PATH roots" `
            --test-filter "model tool projection identifies the actual default command shell" `
            --test-filter "Windows resize polling applies changed console geometry" `
            --test-filter "raw console setup restores captured modes after a partial failure" `
            --test-filter "platform temporary directory resolves to an existing absolute directory" `
            --test-filter "temporary image snapshots use the platform temporary directory" `
            --test-filter "web_fetch Windows connect control does not truncate a later deadline to one second" `
            --test-filter "browser callback survives a reset queued before accept" `
            --test-filter "unified exec returns short commands synchronously" `
            --test-filter "unified exec Windows resolver runs commands through installed Git Bash" `
            --test-filter "unified exec keeps long process addressable and polls output" `
            --test-filter "unified exec writes interactive input without blocking the caller" `
            --test-filter "unified exec Windows reaps each completed stdin writer before replacement" `
            --test-filter "unified exec activates the observer before a direct write can fail" `
            --test-filter "unified exec manager cleanup terminates a still-running process group" `
            --test-filter "native hosts still load project instruction files"

      - name: Smoke test CLI and ACP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $help = & .\zig-out\bin\fx.exe help
          if ($LASTEXITCODE -ne 0 -or -not $help) { throw "fx help failed" }
          $status = & .\zig-out\bin\fx.exe status --json
          if ($LASTEXITCODE -ne 0 -or -not $status) { throw "fx status failed" }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1}}'
            '{"jsonrpc":"2.0","id":2,"method":"session/new","params":{"mcpServers":[]}}'
          )
          $responses = @($requests | .\zig-out\bin\fx.exe acp)
          if ($LASTEXITCODE -ne 0 -or $responses.Count -lt 2) { throw "ACP smoke test failed" }
          $initialize = $responses[0] | ConvertFrom-Json
          $newSession = $responses[1] | ConvertFrom-Json
          if (-not $initialize.result.agentInfo.name -or -not $newSession.result.sessionId) {
            throw "ACP returned an invalid response"
          }

  lint-scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck Fx scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-public-surface.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"
